name: CI/CD Pipeline

# Runs tests on every push/PR to main, and on a push to main that passes tests
# it deploys the application to the EC2 instance over SSH.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          JWT_SECRET: test-secret

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test
        env:
          CI: true

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The EC2 t3.micro is too small to build the React app, so we build it here
      # on the runner and ship the static build to the instance.
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: 'false'
          REACT_APP_API_URL: http://${{ secrets.EC2_HOST }}:5001
        run: |
          npm install
          npm run build

      - name: Copy built frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/build/*"
          target: "/home/ubuntu/medication-reminder-system/frontend/build"
          strip_components: 2
          rm: true

      - name: Update backend and restart with pm2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/medication-reminder-system
            git pull origin main
            cd backend && npm install --omit=dev --no-audit --no-fund
            cd ..
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
